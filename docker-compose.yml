# Docker Compose configuration for VibeVoice Mystery Narrator
# For local testing with GPU support

version: '3.8'

services:
  vibevoice-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibevoice-app:latest
    container_name: vibevoice-mystery-narrator

    ports:
      - "7860:7860"  # Gradio UI

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=0
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_HOME=/models

    volumes:
      # Model weights (persistent across container restarts)
      - ./models:/models
      # Reference voices and ending snippet
      - ./assets:/app/assets
      # Generated audio outputs
      - ./output:/app/output
      # Voice profiles configuration
      - ./config:/app/config

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Shared memory for PyTorch operations
    shm_size: '4gb'

    # Auto-restart on failure
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  models:
  output:
